# Run ddg-onion-mcp with Docker Compose. It uses the HOST's Tor, so Tor must be
# running on the host with its SOCKS port on 127.0.0.1:9050 (the default):
#
#   sudo systemctl enable --now tor        # e.g. Debian/Ubuntu: apt install tor
#   export DDG_MCP_AUTH_TOKEN=$(openssl rand -hex 24)
#   docker compose up -d
#
# The MCP endpoint is http://127.0.0.1:8085/mcp, authenticated with
# "Authorization: Bearer $DDG_MCP_AUTH_TOKEN".
services:
  ddg-onion-mcp:
    image: ${DDG_IMAGE:-ghcr.io/spignelon/ddg-onion-mcp:latest}
    container_name: ddg-onion-mcp
    restart: unless-stopped
    # Host networking makes 127.0.0.1 inside the container the host's loopback,
    # which is how it reaches the host's Tor. No ports are published.
    network_mode: host
    environment:
      DDG_MCP_AUTH_TOKEN: "${DDG_MCP_AUTH_TOKEN:?set DDG_MCP_AUTH_TOKEN first (see the comment at the top of this file)}"
      DDG_MCP_LISTEN: "${DDG_MCP_LISTEN:-127.0.0.1:8085}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
